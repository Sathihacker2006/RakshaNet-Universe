<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer pulse ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Shield outline -->
  <path d="M256 90 L380 145 C380 270 290 375 256 415 C222 375 132 270 132 145 Z" fill="url(#shieldGrad)" />
  
  <!-- Shield Core Details -->
  <path d="M256 120 L355 165 C355 265 285 350 256 385 C227 350 157 265 157 165 Z" fill="#0f172a" opacity="0.3" />
  
  <!-- Signal Waves & Emblem -->
  <path d="M256 170 L256 335" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <path d="M174 252 L338 252" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  
  <!-- Satellite / Beacon dot -->
  <circle cx="256" cy="180" r="16" fill="#38bdf8" />
  <circle cx="256" cy="180" r="28" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
</svg>
